name: Build and Push CMFD Miner Docker Image

on:
  push:
    branches: [master, main]
    paths:
      - 'Dockerfile.cmfd'
      - 'entrypoint_cmfd.sh'
      - '.github/workflows/cmfd.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Baked CMFD Miner (with 6.4GB Model)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: eddgia
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.cmfd
          push: true
          tags: |
            eddgia/cmfd-miner:latest
            eddgia/cmfd-miner:v1.0.2
            ghcr.io/eddgia/cmfd-miner:latest
            ghcr.io/eddgia/cmfd-miner:v1.0.2
